    <main>

        <section class="card">
            <h2>Entrar na área administrativa</h2> <!--API valida as credenciais e entrega um token administrativo -->
            <div id="mensagemLoginAdmin" class="mensagem" role="status" hidden></div>
            <form id="formLoginAdmin">
                <label for="usuarioAdmin">Usuário</label>
                <input id="usuarioAdmin" name="usuario" autocomplete="username" required>
                <label for="senhaAdmin">Senha</label>
                <input id="senhaAdmin" name="senha" type="password" autocomplete="current-password" required>
                <button type="submit">Entrar</button>
            </form>

    </main>
